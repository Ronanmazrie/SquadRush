<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101d31">
  <title>スクワッド・ラッシュ</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d31;color:#fff;font-family:system-ui,sans-serif}
    #unity-canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;gap:20px;text-align:center;padding:24px;background:#101d31}
    #loading[hidden]{display:none}h1{font-size:28px;margin:0}p{color:#b9c8dd;margin:0;line-height:1.8}
    progress{width:min(320px,75vw);height:12px;accent-color:#13b4f3;margin:auto}
    a{color:#63d6ff}#error[hidden]{display:none}
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="540" height="960" tabindex="-1" aria-label="スクワッド・ラッシュのゲーム画面"></canvas>
  <div id="loading">
    <h1>スクワッド・ラッシュ</h1>
    <p id="loading-message">ゲームを読み込んでいます。<br>初回は少し時間がかかります。</p>
    <progress id="progress" value="0" max="1" aria-label="ゲームの読み込み状況"></progress>
    <p id="error" hidden>読み込めませんでした。<br>このページを開き直してください。</p>
    <a href="../">配布ページへ戻る</a>
  </div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const progress = document.getElementById('progress');
    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: '{{{ COMPANY_NAME }}}',
      productName: '{{{ PRODUCT_NAME }}}',
      productVersion: '{{{ PRODUCT_VERSION }}}',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    const script = document.createElement('script');
    script.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
    function showError(error) {
      console.error(error);
      document.getElementById('loading-message').hidden = true;
      progress.hidden = true;
      document.getElementById('error').hidden = false;
    }
    script.onload = () => createUnityInstance(canvas, config, value => progress.value = value)
      .then(instance => { window.squadRushInstance = instance; document.getElementById('loading').hidden = true; })
      .catch(showError);
    script.onerror = showError;
    document.body.appendChild(script);
  </script>
</body>
</html>
